<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Nexora Password</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0c10;
        --panel: #111318;
        --line: rgba(255,255,255,.12);
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #2563eb;
      }
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: var(--bg);
        color: var(--text);
        display: flex;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 18px;
      }
      main {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        max-width: 430px;
        padding: 24px;
        width: 100%;
      }
      h1 { font-size: 24px; margin: 0 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 16px; }
      button, a.button {
        align-items: center;
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        display: inline-flex;
        font: inherit;
        font-weight: 700;
        justify-content: center;
        min-height: 44px;
        padding: 10px 12px;
        text-decoration: none;
        width: 100%;
      }
      a { color: #93c5fd; }
      .status { color: var(--muted); margin-top: 14px; min-height: 22px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Reset Password</h1>
      <p>Nexora uses Clerk for password reset, email verification, and account recovery. Open the Clerk sign-in flow and choose forgot password.</p>
      <button id="openClerk" type="button">Open Clerk Password Reset</button>
      <div class="status" id="status">Loading Clerk...</div>
      <p><a href="/">Return to Nexora</a></p>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const button = document.getElementById("openClerk");
      let clerk = null;

      function status(message) {
        statusEl.textContent = message;
      }

      function loadClerkSdk() {
        return new Promise((resolve, reject) => {
          if (window.Clerk) return resolve();
          const script = document.createElement("script");
          script.src = "https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js";
          script.async = true;
          script.onload = resolve;
          script.onerror = () => reject(new Error("Could not load Clerk."));
          document.head.appendChild(script);
        });
      }

      async function boot() {
        try {
          const response = await fetch("/auth/config", { headers: { Accept: "application/json" } });
          if (!response.ok) throw new Error("Auth configuration is unavailable.");
          const config = await response.json();
          if (!config.configured || !config.clerk_publishable_key) throw new Error("Clerk is not configured.");
          await loadClerkSdk();
          clerk = new window.Clerk(config.clerk_publishable_key);
          await clerk.load();
          status("Ready.");
        } catch (error) {
          status(error.message || "Could not start password reset.");
        }
      }

      button.addEventListener("click", () => {
        if (!clerk) {
          status("Clerk is still loading.");
          return;
        }
        clerk.openSignIn({ redirectUrl: window.location.origin + "/" });
        status("Choose forgot password in the Clerk sign-in flow.");
      });

      boot();
    </script>
  </body>
</html>
