<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Nexora Password</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0c10;
        --panel: #111318;
        --line: rgba(255,255,255,.12);
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #2563eb;
        --danger: #fca5a5;
        --ok: #86efac;
      }
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: var(--bg);
        color: var(--text);
        display: flex;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 18px;
      }
      main {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        max-width: 420px;
        padding: 24px;
        width: 100%;
      }
      h1 { font-size: 24px; margin: 0 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 16px; }
      input, button {
        border-radius: 8px;
        font: inherit;
        min-height: 44px;
        width: 100%;
      }
      input {
        background: #181b22;
        border: 1px solid var(--line);
        color: var(--text);
        margin-bottom: 12px;
        padding: 10px 12px;
      }
      button {
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 700;
        padding: 10px 12px;
      }
      .status { color: var(--muted); margin-top: 14px; min-height: 22px; }
      .status[data-kind="error"] { color: var(--danger); }
      .status[data-kind="ok"] { color: var(--ok); }
      a { color: #93c5fd; }
    </style>
  <link rel="stylesheet" href="/ui.css?v=20260808">
  <script src="/ui.js?v=20260808" defer></script>
</head>
<body data-matrixs-page="reset-password">
    <main>
      <h1>Reset Password</h1>
      <p>Enter a new password for your Nexora account. This page only works from a valid Supabase recovery link.</p>
      <input id="password" type="password" placeholder="New password" autocomplete="new-password">
      <input id="confirm" type="password" placeholder="Confirm new password" autocomplete="new-password">
      <button id="submit" type="button">Update password</button>
      <div class="status" id="status">Checking recovery session...</div>
      <p><a href="/">Return to Nexora</a></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const statusEl = document.getElementById("status");
      const passwordEl = document.getElementById("password");
      const confirmEl = document.getElementById("confirm");
      const submitEl = document.getElementById("submit");
      let client = null;
      let recoveryReady = false;

      function status(message, kind) {
        statusEl.textContent = message;
        statusEl.dataset.kind = kind || "info";
      }

      function hashParams() {
        const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : window.location.hash;
        return new URLSearchParams(hash);
      }

      async function boot() {
        try {
          const response = await fetch("/auth/config", { headers: { Accept: "application/json" } });
          if (!response.ok) throw new Error("Auth configuration is unavailable.");
          const config = await response.json();
          if (!config.configured) throw new Error("Supabase Auth is not configured.");
          client = window.supabase.createClient(config.supabase_url, config.supabase_anon_key, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
          });

          const params = hashParams();
          const accessToken = params.get("access_token");
          const refreshToken = params.get("refresh_token");
          const code = new URLSearchParams(window.location.search).get("code");
          if (accessToken && refreshToken) {
            const { error } = await client.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
            if (error) throw error;
            recoveryReady = true;
          } else if (code) {
            const { error } = await client.auth.exchangeCodeForSession(code);
            if (error) throw error;
            recoveryReady = true;
          } else {
            const { data } = await client.auth.getSession();
            recoveryReady = Boolean(data && data.session);
          }
          status(recoveryReady ? "Recovery session ready." : "Invalid or expired reset link.", recoveryReady ? "ok" : "error");
        } catch (error) {
          status(error.message || "Could not start password reset.", "error");
        }
      }

      submitEl.addEventListener("click", async () => {
        try {
          if (!recoveryReady) throw new Error("Invalid or expired reset link.");
          const password = passwordEl.value;
          const confirm = confirmEl.value;
          if (password.length < 6) throw new Error("Password must be at least 6 characters.");
          if (password !== confirm) throw new Error("Passwords do not match.");
          status("Updating password...", "info");
          const { error } = await client.auth.updateUser({ password });
          if (error) throw error;
          await client.auth.signOut();
          status("Password updated. Sign in with your new password.", "ok");
        } catch (error) {
          status(error.message || "Password update failed.", "error");
        }
      });

      boot();
    </script>
  </body>
</html>
