<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Nexora Password</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0c10;
        --panel: #111318;
        --line: rgba(255,255,255,.12);
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #2563eb;
      }
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: var(--bg);
        color: var(--text);
        display: flex;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 18px;
      }
      main {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        max-width: 430px;
        padding: 24px;
        width: 100%;
      }
      h1 { font-size: 24px; margin: 0 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 16px; }
      button, a.button {
        align-items: center;
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        display: inline-flex;
        font: inherit;
        font-weight: 700;
        justify-content: center;
        min-height: 44px;
        padding: 10px 12px;
        text-decoration: none;
        width: 100%;
      }
      a { color: #93c5fd; }
      .status { color: var(--muted); margin-top: 14px; min-height: 22px; }
    </style>
    <link rel="stylesheet" href="/ui.css?v=20260808">
    <script src="/ui.js?v=20260808" defer></script>
  </head>
  <body data-matrixs-page="reset-password">
    <main>
      <h1>Reset Password</h1>
      <p>Nexora uses Clerk for password reset, email verification, and account recovery. Open the Clerk sign-in flow and choose forgot password.</p>
      <button id="openClerk" type="button">Open Clerk Password Reset</button>
      <div class="status" id="status">Loading Clerk...</div>
      <p><a href="/">Return to Nexora</a></p>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const button = document.getElementById("openClerk");
      let clerk = null;

      function status(message) {
        statusEl.textContent = message;
      }

      function clerkFrontendApi(config) {
        const encoded = String(config.clerk_publishable_key || "").split("_").slice(2).join("_");
        if (encoded) {
          try {
            const decoded = atob(encoded).replace(/\$$/, "");
            if (decoded) return decoded;
          } catch (_error) {}
        }
        try {
          return new URL(config.clerk_jwt_issuer || "").host;
        } catch (_error) {
          return "";
        }
      }

      function loadScript(id, src, attributes) {
        return new Promise((resolve, reject) => {
          const existing = document.getElementById(id);
          if (existing) {
            existing.addEventListener("load", resolve, { once: true });
            existing.addEventListener("error", reject, { once: true });
            return;
          }
          const script = document.createElement("script");
          script.id = id;
          script.src = src;
          script.async = true;
          script.crossOrigin = "anonymous";
          Object.entries(attributes || {}).forEach(([name, value]) => script.setAttribute(name, value));
          script.onload = resolve;
          script.onerror = () => reject(new Error("Could not load Clerk."));
          document.head.appendChild(script);
        });
      }

      async function loadClerkSdk(config) {
        if (window.Clerk) return;
        const frontendApi = clerkFrontendApi(config);
        if (!frontendApi) throw new Error("Clerk frontend API is unavailable.");
        const baseUrl = `https://${frontendApi}/npm`;
        await loadScript("nexora-clerk-ui", `${baseUrl}/@clerk/ui@1/dist/ui.browser.js`);
        await loadScript(
          "nexora-clerk-js",
          `${baseUrl}/@clerk/clerk-js@6/dist/clerk.browser.js`,
          { "data-clerk-publishable-key": config.clerk_publishable_key },
        );
      }

      function createClerkInstance(config) {
        const exported = window.Clerk;
        if (typeof exported === "function") return new exported(config.clerk_publishable_key);
        if (exported && typeof exported.Clerk === "function") return new exported.Clerk(config.clerk_publishable_key);
        if (exported && typeof exported.default === "function") return new exported.default(config.clerk_publishable_key);
        if (exported && typeof exported.load === "function") return exported;
        if (exported && exported.default && typeof exported.default.load === "function") return exported.default;
        throw new Error("Clerk authentication SDK did not initialize.");
      }

      async function boot() {
        try {
          const response = await fetch("/auth/config", { headers: { Accept: "application/json" } });
          if (!response.ok) throw new Error("Auth configuration is unavailable.");
          const config = await response.json();
          if (!config.configured || !config.clerk_publishable_key) throw new Error("Clerk is not configured.");
          await loadClerkSdk(config);
          clerk = createClerkInstance(config);
          const loadOptions = { publishableKey: config.clerk_publishable_key };
          if (window.__internal_ClerkUICtor) {
            loadOptions.ui = { ClerkUI: window.__internal_ClerkUICtor };
          }
          await clerk.load(loadOptions);
          status("Ready.");
        } catch (error) {
          status(error.message || "Could not start password reset.");
        }
      }

      button.addEventListener("click", () => {
        if (!clerk) {
          status("Clerk is still loading.");
          return;
        }
        clerk.openSignIn({ redirectUrl: window.location.origin + "/" });
        status("Choose forgot password in the Clerk sign-in flow.");
      });

      boot();
    </script>
  </body>
</html>
