services:
  - type: web
    name: nexora-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NEXORA_PROVIDER
        value: auto
      - key: NEXORA_ADAPTIVE_MODEL_ROUTING
        value: "true"
      - key: NEXORA_OLLAMA_MODE
        value: fallback
      - key: NEXORA_FORCE_OLLAMA_CHAT
        value: "false"
      - key: NEXORA_LOCK_QWEN
        value: "false"
      - key: NEXORA_FAST_MODEL
        value: qwen2.5:3b
      - key: NEXORA_THINKING_MODEL
        value: qwen3:14b
      - key: OLLAMA_URL
        value: http://52.237.82.140:8000/ollama/64a40f47d13cdedb022b72a961b8c5d5ce7793ac78c68f2d
      - key: NEXORA_OLLAMA_CONTEXT_TOKENS
        value: "512"
      - key: NEXORA_OLLAMA_INSTANT_MAX_TOKENS
        value: "160"
      - key: NEXORA_OLLAMA_THINKING_MAX_TOKENS
        value: "120"
      - key: NEXORA_PROVIDER_INSTANT_TIMEOUT
        value: "12"
      - key: NEXORA_PROVIDER_THINKING_TIMEOUT
        value: "35"
      - key: NEXORA_OLLAMA_INSTANT_TIMEOUT
        value: "25"
      - key: NEXORA_OLLAMA_THINKING_TIMEOUT
        value: "75"
      - key: NEXORA_AUTONOMOUS_RESEARCH
        value: "true"
      - key: NEXORA_IMAGE_PROVIDER
        value: pollinations
      - key: NEXORA_FREE_CLUB_MODE
        value: auto
      - key: NEXORA_MAX_MEMORY_ITEMS
        value: "600"
      - key: NEXORA_MAX_MEMORY_CONTEXT_ITEMS
        value: "18"
      - key: NEXORA_MEMORY_CONTEXT_CHARS
        value: "4200"
      - key: NEXORA_MAX_IMAGE_MEMORY_ITEMS
        value: "600"
      - key: NEXORA_IMAGE_EXACT_MATCH
        value: "true"
      - key: NEXORA_IMAGE_PROVIDER_ENHANCE
        value: "false"
      - key: NEXORA_PUBLIC_APP_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWT_ISSUER
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
