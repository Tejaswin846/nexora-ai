services:
  - type: web
    name: nexora-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NEXORA_PROVIDER
        value: ollama
      - key: NEXORA_OLLAMA_MODE
        value: primary
      - key: NEXORA_FAST_MODEL
        value: qwen3:14b
      - key: NEXORA_THINKING_MODEL
        value: qwen3:14b
      - key: OLLAMA_URL
        value: http://127.0.0.1:11434
      - key: NEXORA_AUTONOMOUS_RESEARCH
        value: "true"
      - key: NEXORA_IMAGE_PROVIDER
        value: pollinations
      - key: NEXORA_FREE_CLUB_MODE
        value: auto
      - key: NEXORA_MAX_MEMORY_ITEMS
        value: "600"
      - key: NEXORA_MAX_MEMORY_CONTEXT_ITEMS
        value: "18"
      - key: NEXORA_MEMORY_CONTEXT_CHARS
        value: "4200"
      - key: NEXORA_MAX_IMAGE_MEMORY_ITEMS
        value: "600"
      - key: NEXORA_IMAGE_EXACT_MATCH
        value: "true"
      - key: NEXORA_IMAGE_PROVIDER_ENHANCE
        value: "false"
